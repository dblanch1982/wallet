name: Kubernetes CI
on:
  push:
    branches:
      - main

jobs:
  wallet-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@v4
    - name: Build the Docker image
      run: "docker build -t dainablanch/wallet:${GITHUB_SHA::7} ."
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_PASSWORD }}"
    - name: Push  Docker Image to Docker Hub
      run: "docker push dainablanch/wallet:${GITHUB_SHA::7}"
    - name: Install yq
      run: 
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -0 /usr/bin/yq
        sudo chmod +x /usr/bin/yq
    - name: Update deployment.yml with latest docker tag
      run: |
        # Short commit hash
        SHORT_SHA=${GITHUB_SHA::7}
        # Update image tag in deployment.yaml
        yq -i '.spec.template.spec.container[0].image = "dainablanch/wallet:'"$SHORT_SHA"'"' ./k8s/deployment.yml
    - name: Commit deployment file changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.mail "github-actions@noreply"
        git add k8s/deployment.yml
        git commit -m 'docker tag updated by GHA'
        git push origin main

 